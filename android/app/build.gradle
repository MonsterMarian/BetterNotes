apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Minuty od epochy: každý build je vyšší než ten předchozí, takže Android
// instalaci bere jako aktualizaci a nechá data být. Ručně psané číslo se
// zapomene zvýšit a telefon pak novou verzi odmítne jako downgrade.
def buildNumber = (int) (System.currentTimeMillis() / 60000L)
def buildStamp = new Date().format("yyyy.MM.dd.HHmm")

// Podpisový klíč pro release. keystore.properties i .jks jsou mimo git.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "cz.betternotes.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cz.betternotes.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNumber
        versionName buildStamp
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // CzechSpeech i sherpa-onnx běží na 64-bit Androidu; zbytek ABI by jen nafoukl APK.
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps.containsKey("storeFile")) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
            // Všechna schémata naráz. Jen v2 některé instalátory odmítnou
            // hláškou "Aplikaci nelze nainstalovat".
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    buildTypes {
        debug {
            // I debug build ať se podepíše v1 + v2, ne jen v2.
            signingConfig signingConfigs.debug
            // Ladicí build se instaluje vedle ostrého, ať testování nesáhne na data.
            applicationIdSuffix ".test"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def sherpaOnnxAar = file('libs/sherpa-onnx-static-link-onnxruntime-2.0.3.aar')
tasks.register('ensureSherpaOnnxAar') {
    doLast {
        if (!sherpaOnnxAar.exists()) {
            sherpaOnnxAar.parentFile.mkdirs()
            def url = new URL('https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-static-link-onnxruntime-2.0.3.aar')
            logger.lifecycle("Stahuji sherpa-onnx AAR: ${url}")
            url.withInputStream { input ->
                sherpaOnnxAar.withOutputStream { output -> output << input }
            }
        }
    }
}
preBuild.dependsOn(ensureSherpaOnnxAar)

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files(sherpaOnnxAar)
    implementation 'ai.moravian:czechspeech-android:0.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
